<html>
    <head>
        <title>Використання таблиць</title>
        <meta charset="utf-8">
    </head>
    <body bgcolor="FFFFFF">
        <p align="center">
            <font color="red" size="6 face="ARIAL">
            <font color="blue" size="4" face="COURIER">
            <table width="100%" border="1" cellspacing="0" cellpadding="5" bordercolorlight="#999966" bordercolordark="#9999FF">
               <caption>Середні характеристики</caption>
                <tr>
                    <td colspan="2" rowspan="2">&nbsp;</td>
                    <td colspan="2">Характеристики</td>
                </tr>
                <tr>
                    <td>Середній зріст, см</td>
                    <td>Середня вага, кг</td>
                </tr>
                <tr align="center">
                    <td rowspan="2">Стать</td>
                    <td>Чоловіча</td>
                    <td>177</td>
                    <td>73</td>
                </tr>
                <tr align="center">
                    <td>Жіноча</td>
                    <td>166</td>
                    <td>65</td>
                </tr>
            </table>
    </body>
</html>
