<html>
    <head>
        <title>Використання таблиць</title>
        <meta charset="utf-8">
    </head>
    <body bgcolor="FFFFFF">
        <p align="center">
            <font color="red" size="6 face="ARIAL">
            <font color="blue" size="4" face="COURIER">
            <table width="75%" border="1" cellspacing="0" cellpadding="5" bordercolorlight="#999966" bordercolordark="#9999FF">          
                <tr>
                    <td colspan="2" align="center">Заголовок</td>
                </tr>
                <tr height="80">
                    <td align="left" width="25%">Дані, вирівняні по лівому краю комірки</td>
                    <td align="right" width="75%">Дані, вирівняні по правому краю комірки</td>
                </tr> 
                <tr align="center">
                    <td rowspan="1" align="left">25% ширини таблиці</td>
                    <td align="left">75% ширини таблиці</td>  
                </tr>
            </table>
    </body>
</html>
