<html>
    <head>
        <meta charset="UTF-8">
        <title>Вертикальні рядки, що біжать</title>
    </head>
    <body bgcolor="#F0F0F0">
        <p align="center">
            <marquee width="800" height="100" bgcolor="#99FF00" direction="up" behavior="alternate">
                <font color="#8B008B" face="Verdana" size="4"><b><i>
                    Рядок 1: текст коливається вгору-вниз
                </i></b></font>
            </marquee>
            <br><br>
            <marquee width="800" height="100" bgcolor="#FFCC66" direction="up" behavior="scroll">
                <font color="#000080" face="Verdana" size="4"><b><i>
                    Рядок 2: біжить знизу догори та з'являється знову
                </i></b></font>
            </marquee>
            <br><br>
            <marquee width="800" height="100" bgcolor="#66CCFF" direction="down" behavior="slide">
                <font color="#8B0000" face="Verdana" size="4"><b><i>
                    Рядок 3: біжить згори донизу й зупиняється у границі
                </i></b></font>
            </marquee>
            <br><br>
            <marquee width="800" height="100" bgcolor="#FF99CC" direction="up" scrolldelay="10">
                <font color="#006400" face="Verdana" size="4"><b><i>
                    Рядок 4: запізнення 10 (швидко)
                </i></b></font>
            </marquee>
            <br><br>
            <marquee width="800" height="100" bgcolor="#CCCCFF" direction="up" scrolldelay="300">
                <font color="#8B4500" face="Verdana" size="4"><b><i>
                    Рядок 5: запізнення 300 (повільно)
                </i></b></font>
            </marquee>
        </p>
    </body>
</html>
