<html>
<head>
    <title>Моя Батьківщина</title>
    <meta charset="UTF-8">
</head>
<body bgcolor="#CCE5CC">
<h1 align="center"><font color="#006400">Моя Батьківщина</font></h1>
<center>
    <table border="0">
        <tr>
            <td valign="top">
                <img src="карпати.jpg" width="300" height="260" border="1" usemap="#karpaty">
                <map name="karpaty">
                    <area shape="rect" coords="0,0,300,260" href="карпати.jpg" title="Карпати — це велика гірська система в Центральній та Східній Європі">
                </map>
            </td>
            <td valign="top">
                <img src="Дніпро.jpg" width="300" height="360" border="1" usemap="#dnipro">
                <map name="dnipro">
                    <area shape="rect" coords="0,0,300,360" href="Дніпро.jpg" title="Дніпро — це найбільша ріка України, яка протікає через центральну частину країни та впадає в Чорне море">
                </map>
            </td>
            <td valign="top">
                <img src="Південний Буг.jpg" width="300" height="360" border="1" usemap="#buh">
                <map name="buh">
                    <area shape="rect" coords="0,0,300,360" href="Південний Буг.jpg" title="Південний Буг — це найдовша річка, яка повністю протікає територією України. Вона займає третє місце за довжиною в межах країни (після Дніпра та Дністра) і є унікальною тим, що її басейн не перетинає кордонів інших держав.">
                </map>
            </td>
        </tr>
    </table>
</center>
</body>
</html>
