<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація користувача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <h1>Мій особистий блог</h1>
        <p>Попов Станіслав</p>
    </div>
    <nav class="nav">
        <a href="index.htm">Вхід</a>
        <a href="register.htm">Реєстрація</a>
    </nav>
</header>

<main class="main">
    <section class="register">
        <h2>Реєстрація користувача</h2>
        <form action="#" method="post">
            <label for="surname">Прізвище</label>
            <input type="text" id="surname" name="surname">

            <label for="firstname">Ім'я</label>
            <input type="text" id="firstname" name="firstname">

            <label for="login">Логін</label>
            <input type="text" id="login" name="login">

            <label for="group" class="big">Навчальна група</label>
            <select id="group" name="group">
                <option value="301-ТН">301-ТН</option>
                <option value="302-ТН">302-ТН</option>
                <option value="303-ТН">303-ТН</option>
            </select>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password">

            <label for="password2">Підтвердження паролю</label>
            <input type="password" id="password2" name="password2">

            <div class="btn-row">
                <button type="submit">Зареєструватись</button>
            </div>
        </form>
    </section>
</main>

<footer class="footer">
    <p>Всі права захищені.</p>
    <p>Розробник: студент групи 302-ТН Попов С.С.</p>
</footer>

</body>
</html>
