<html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Адаптивна сітка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f8f9fa; 
        }
        .block {
            border: 1px solid #ced4da;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            font-size: 16px;
            text-align: center;
            background-color: #fff; 
        }

        @media (min-width: 1200px) {
            .bg-orange { background-color: #f3d49c !important; }
            .text-red { color: red; font-weight: bold; }
            .text-blue { color: blue; text-decoration: underline; }
        }

        @media (min-width: 992px) and (max-width: 1199.98px) {
            .bg-pink { background-color: #fbc4c4 !important; }
        }

        @media (min-width: 768px) and (max-width: 991.98px) {
            .bg-purple { background-color: #e89ee8 !important; }
            .text-large { font-size: 24px; }
        }

        @media (max-width: 767.98px) {
        }
    </style>
</head>
<body>

    <div class="container-fluid d-flex flex-column h-100 p-0">
        
        <div class="row g-0">
            <div class="col-xl-8 col-lg-4 col-md-6 col-12 block bg-orange">
                Ліва частина шапки
            </div>
            <div class="col-xl-4 col-lg-8 col-md-6 col-12 block bg-pink text-red text-large">
                Права частина шапки
            </div>
        </div>

        <div class="row g-0 flex-grow-1">
            <div class="col-xl-2 col-lg-3 col-md-12 col-12 block bg-purple">
                Ліве меню
            </div>
            <div class="col-xl-8 col-lg-6 col-md-12 col-12 block bg-pink">
                Контент
            </div>
            <div class="col-xl-2 col-lg-3 col-md-12 col-12 block bg-purple">
                Праве меню
            </div>
        </div>

        <div class="row g-0">
            <div class="col-xl-4 col-lg-8 col-md-6 col-12 block bg-pink text-blue">
                Ліва частина підвалу
            </div>
            <div class="col-xl-8 col-lg-4 col-md-6 col-12 block bg-orange">
                Права частина підвалу
            </div>
        </div>

    </div>

</body>
</html>
