<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кольорові блоки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .box {
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: white;
            min-height: 200px;
        }

        @media (min-width: 1200px) {
            #box1 { background-color: #4a86c6; } /* Синій */
            #box2 { background-color: #f1c40f; } /* Жовтий */
            #box3 { background-color: #c0392b; } /* Червоний */
        }

        @media (min-width: 992px) and (max-width: 1199.98px) {
            #box1 { background-color: #4a86c6; }
            #box2 { background-color: #f1c40f; }
            #box3 { background-color: #c0392b; }
        }

        @media (min-width: 768px) and (max-width: 991.98px) {
            #box1 { background-color: #4a86c6; }
            #box2 { background-color: #f1c40f; }
            #box3 { background-color: #c0392b; }
        }

        @media (max-width: 767.98px) {
            #box1 { background-color: #4a86c6; }
            #box2 { background-color: #f1c40f; }
            #box3 { background-color: #c0392b; }
        }
    </style>
</head>
<body>

    <div class="container-fluid d-flex flex-column h-100 p-0">
        <div class="row g-0 flex-grow-1">
            <div id="box1" class="col-xl-6 col-lg-8 col-md-12 col-12 box">#1</div>
            <div id="box2" class="col-xl-3 col-lg-4 col-md-6 col-12 box">#2</div>
            <div id="box3" class="col-xl-3 col-lg-12 col-md-6 col-12 box">#3</div>
        </div>
    </div>

</body>
</html>
